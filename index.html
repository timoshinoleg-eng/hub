<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<title>Игротека</title>
<link rel="stylesheet" href="css/hub.css">
<script src="https://st.max.ru/js/max-web-app.js" defer></script>
<script>
  window.HUB_CONFIG = {
    bot: '',
    hubName: 'Игротека',
    policyUrl: '',
    offerUrl: '',
    orgName: '',
  };
  // window.HUB_TRACK_ENDPOINT = 'https://api.example.com/ev';
</script>
</head>
<body data-view="menu">
<div class="ambient ambient-a" aria-hidden="true"></div>
<div class="ambient ambient-b" aria-hidden="true"></div>

<div id="view-menu">
  <header class="hero-head">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div>
        <div class="kicker">MAX MINI ARCADE</div>
        <h1>Игротека</h1>
        <p>Короткие игры. Рекорды. Новый вызов каждый день.</p>
      </div>
    </div>
    <div class="streak-chip" id="streak-chip" aria-label="Серия дней"></div>
  </header>

  <section id="daily-card" class="daily-shell" aria-label="Игра дня"></section>

  <div class="section-head">
    <div>
      <span class="eyebrow">АРКАДА</span>
      <h2>Выбери игру</h2>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div id="games" class="game-grid"></div>

  <section id="progress-strip" class="progress-strip" aria-label="Ваш прогресс"></section>
  <p class="mfoot" id="legal"></p>
</div>

<div id="view-game">
  <div class="gbar">
    <button id="back" class="icon-btn" aria-label="Назад">‹</button>
    <div class="gtitle">
      <h2 id="game-title">Игра</h2>
      <span id="game-meta"></span>
    </div>
    <span id="game-score"></span>
    <button id="reload" class="icon-btn" aria-label="Заново">↻</button>
  </div>
  <iframe id="game-frame" title="Игра" allow="autoplay"></iframe>
</div>

<div id="overlay"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
