worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # The service worker must be served as the worker script and nothing else.
    # With the SPA fallback below a missing sw.js would come back as index.html
    # with status 200, and registration would fail on the MIME type instead of
    # on the real cause. It is also deliberately no-store: the browser has to
    # byte-compare the script on every launch, or a new release never reaches
    # the cache and offline keeps serving the previous build.
    location = /sw.js {
      add_header Cache-Control "no-store" always;
      add_header Service-Worker-Allowed "/" always;
      try_files $uri =404;
    }

    # The shell and its modules are revalidated before each MAX launch, so a
    # new Hub release is not shadowed by a cached response.
    location ~* \.(?:html|js)$ {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri $uri/ /index.html;
    }

    # A web app manifest is only accepted as application/manifest+json. The
    # base image's mime.types is not guaranteed to carry this type, and a wrong
    # one makes the browser ignore the manifest silently.
    location = /manifest.webmanifest {
      types { } default_type application/manifest+json;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
