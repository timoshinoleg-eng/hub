<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Игротека">
  <!--
    Вариант для purpose="maskable". Отдельный файл, а не переиспользование
    assets/icon.svg: система сама накладывает маску, поэтому фон обязан
    заливать весь квадрат без скруглений, иначе по краям вылезет прозрачность.

    Знак ужат внутрь безопасной зоны (центральные 80%): при круглой маске
    Android всё, что ближе к краю, обрезается.
  -->
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="markm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6cff"/>
      <stop offset="0.48" stop-color="#5a54ff"/>
      <stop offset="1" stop-color="#36cfdf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgm)"/>
  <path fill="url(#markm)" d="M256 133l36 87 87 36-87 36-36 87-36-87-87-36 87-36z"/>
</svg>
