<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Квиз дня</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="qwrap">
  <header class="qhead"><span>✦ 10 ВОПРОСОВ СЕГОДНЯ</span><h1>Квиз дня</h1><p>Один набор на всех — сравни результат с друзьями.</p></header>
  <div class="qhud"><span>Вопрос <strong id="q-index">1/10</strong></span><span>Верно <strong id="q-score">0</strong></span></div>
  <div class="qtrack"><i id="q-progress"></i></div>
  <section id="quiz" aria-live="polite"></section>
  <div id="result" class="result" aria-live="polite"></div>
</main>
<script src="script.js"></script>
<script src="../_boot.js" data-game="quiz"></script>
</body>
</html>
