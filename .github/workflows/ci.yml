name: CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Assets and vendor invariants
        run: npm run check
      - name: Product and playability contract
        run: npm run smoke:product
      - name: Iframe bridge contract
        run: npm run smoke:bridge
      - name: Analytics transport and privacy
        run: npm run smoke:track
      - name: MAX initData authentication
        run: npm run smoke:auth
      - name: Merge mechanics
        run: npm run smoke:merge
      - name: Daily timezone boundary
        run: npm run smoke:daily-seed
      - name: Local progression
        run: npm run smoke:progress
      - name: Server contracts
        run: npm run smoke:server
      - name: Bot contracts
        run: npm run smoke:bot
      - name: Daily determinism
        run: npm run smoke:daily
      - name: Duel logic
        run: npm run smoke:duel
